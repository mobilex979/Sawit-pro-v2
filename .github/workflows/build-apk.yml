name: Build SAWIT PRO v2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=sawit_pro_v2 .
          fi

      - name: Add ML Kit language dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]

          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('android/app/build.gradle(.kts) tidak ditemukan')

          text = gradle.read_text()
          deps = '''
              // ML Kit Text Recognition language modules required by
              // google_mlkit_text_recognition during release/R8 builds.
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          '''

          if 'text-recognition-korean:16.0.1' not in text:
              match = re.search(r'(?m)^dependencies\\s*\\{', text)
              if not match:
                  raise SystemExit(f'blok dependencies tidak ditemukan di {gradle}')
              insert_at = match.end()
              text = text[:insert_at] + '\n' + deps + text[insert_at:]
              gradle.write_text(text)
              print(f'ML Kit language dependencies ditambahkan ke {gradle}')
          else:
              print('ML Kit language dependencies sudah ada')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAWIT_PRO_v2_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
