name: Build SAWIT PRO v2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=sawit_pro_v2 .
          fi

      - name: Configure Android for ML Kit OCR
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle.kts')
          if not path.exists():
              path = Path('android/app/build.gradle')
          if not path.exists():
              raise SystemExit('android/app/build.gradle(.kts) tidak ditemukan')

          text = path.read_text()
          deps = [
              'com.google.mlkit:text-recognition-chinese:16.0.1',
              'com.google.mlkit:text-recognition-devanagari:16.0.1',
              'com.google.mlkit:text-recognition-japanese:16.0.1',
              'com.google.mlkit:text-recognition-korean:16.0.1',
          ]

          if path.suffix == '.kts':
              lines = [f'    implementation("{d}")' for d in deps]
          else:
              lines = [f"    implementation '{d}'" for d in deps]

          missing = [i for i, d in enumerate(deps) if d not in text]
          if missing:
              m = re.search(r'(?m)^dependencies\s*\{', text)
              if not m:
                  raise SystemExit(f'Blok dependencies tidak ditemukan di {path}')
              addition = '\n' + '\n'.join(lines[i] for i in missing)
              text = text[:m.end()] + addition + text[m.end():]
              path.write_text(text)

          final = path.read_text()
          print(f'Configured: {path}')
          for d in deps:
              if d not in final:
                  raise SystemExit('MISSING: ' + d)
              print('OK: ' + d)
          PY

          echo '===== ML Kit dependencies ====='
          grep -n 'text-recognition-' android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAWIT_PRO_v2_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
